<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B12"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Logo Core Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Radial Ambient Glow behind the logo -->
  <circle cx="256" cy="256" r="140" fill="#8B5CF6" opacity="0.12" filter="url(#glow)"/>

  <!-- Left Code Bracket Accent < -->
  <path d="M 96 216 L 68 256 L 96 296" 
        fill="none" 
        stroke="#06B6D4" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.75" />

  <!-- Right Code Bracket Accent > -->
  <path d="M 416 216 L 444 256 L 416 296" 
        fill="none" 
        stroke="#8B5CF6" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.75" />

  <!-- Monogram "FK" Symbol Group -->
  <g filter="url(#glow)">
    <!-- F & K Unified Stem (Vertical Bar) -->
    <rect x="164" y="136" width="36" height="240" rx="18" fill="url(#brandGrad)"/>

    <!-- F Top Horizontal Bar -->
    <rect x="164" y="136" width="112" height="36" rx="18" fill="url(#brandGrad)"/>

    <!-- F Mid Horizontal Bar -->
    <rect x="164" y="238" width="86" height="34" rx="17" fill="url(#brandGrad)"/>

    <!-- K Upper Diagonal Arm -->
    <path d="M 236 250 L 338 148 C 345 141 356 141 363 148 C 370 155 370 166 363 173 L 272 264 Z" 
          fill="url(#brandGrad)"/>

    <!-- K Lower Diagonal Leg -->
    <path d="M 252 244 L 348 357 C 354 365 353 376 345 382 C 337 388 326 387 320 379 L 222 264 Z" 
          fill="url(#accentGrad)"/>

    <!-- Glowing Tech Node Dot -->
    <circle cx="355" cy="155" r="9" fill="#06B6D4" filter="url(#glow)"/>
  </g>
</svg>
