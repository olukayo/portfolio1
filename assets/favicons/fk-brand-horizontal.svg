<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Background Frame Gradient -->
    <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="navBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Brand Gradient -->
    <linearGradient id="navBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="navAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Mark: Scaled-down FK Squircle (100x100) -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#navBgGrad)" stroke="url(#navBorderGrad)" stroke-width="2"/>
    
    <!-- Code Brackets -->
    <path d="M 16 42 L 9 50 L 16 58" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M 84 42 L 91 50 L 84 58" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- FK Monogram -->
    <g transform="translate(5, 5) scale(0.18)">
      <rect x="164" y="136" width="36" height="240" rx="18" fill="url(#navBrandGrad)"/>
      <rect x="164" y="136" width="112" height="36" rx="18" fill="url(#navBrandGrad)"/>
      <rect x="164" y="238" width="86" height="34" rx="17" fill="url(#navBrandGrad)"/>
      <path d="M 236 250 L 338 148 C 345 141 356 141 363 148 C 370 155 370 166 363 173 L 272 264 Z" fill="url(#navBrandGrad)"/>
      <path d="M 252 244 L 348 357 C 354 365 353 376 345 382 C 337 388 326 387 320 379 L 222 264 Z" fill="url(#navAccentGrad)"/>
      <circle cx="355" cy="155" r="9" fill="#06B6D4"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 0)">
    <!-- Primary Name -->
    <text x="0" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="30" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
      FAJIMI <tspan fill="url(#navBrandGrad)">KAYODE</tspan>
    </text>

    <!-- Subtitle / Role -->
    <text x="0" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="3" fill="#94A3B8">
      FRONTEND &amp; MOBILE DEVELOPER
    </text>

    <!-- Subtle code dot divider & active status badge -->
    <circle cx="295" cy="82" r="3.5" fill="#10B981" />
  </g>
</svg>
